services:
  sevshield:
    build: .
    image: sevshield:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # SQLite (default). Ignored when DATABASE_URL is set.
      DATABASE_PATH: /data/sevshield.db
      # Postgres (optional): set DATABASE_URL to switch backends, e.g.
      # DATABASE_URL=postgres://sevshield:${POSTGRES_PASSWORD}@db:5432/sevshield?sslmode=disable
      # and start with: docker compose --profile pg up --build -d
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?set KEY_ENCRYPTION_KEY in .env}
      DISABLE_UI: ${DISABLE_UI:-0}
      PROXY_TIMEOUT_SECONDS: ${PROXY_TIMEOUT_SECONDS:-30}
      PROXY_MAX_BODY_MB: ${PROXY_MAX_BODY_MB:-20}
    volumes:
      - sevshield-data:/data
    restart: unless-stopped
    depends_on:
      # Only takes effect with --profile pg (db service below). Needs a
      # recent Compose; drop this block if yours rejects `required`.
      db:
        condition: service_healthy
        required: false

  # Optional Postgres backend (opt-in via --profile pg). Data persists in
  # the `pgdata` volume. Credentials come from .env (see .env.sample).
  db:
    profiles: ["pg"]
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sevshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env when using --profile pg}
      POSTGRES_DB: ${POSTGRES_DB:-sevshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sevshield}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sevshield-data:
  pgdata:
